name: Release OXT

# Publica uma release quando a versão em src/description.xml ainda não tem tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP '<version value="\K[^"]+' src/description.xml)
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          if gh release view "v${VER}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${VER} já existe; nada a fazer."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ClaudeCalc.oxt
        if: steps.ver.outputs.exists == 'false'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zip
          sed -i 's/$//' build.sh
          bash build.sh

      - name: Create release
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" dist/ClaudeCalc.oxt \
            --target "${GITHUB_SHA}" \
            --title "Claude for Calc ${{ steps.ver.outputs.tag }}" \
            --generate-notes
